<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favicon-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="favicon-card" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.85" />
    </linearGradient>

    <!-- AI Spark Gradient -->
    <linearGradient id="favicon-spark" x1="28" y1="12" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="favicon-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Rich Radial & Linear Sheen -->
  <rect width="48" height="48" rx="13" fill="url(#favicon-bg)" />
  <rect width="46" height="46" x="1" y="1" rx="12" stroke="white" stroke-opacity="0.2" stroke-width="1" />

  <!-- Layer 1: Back Form Document (offset top-left) -->
  <path d="M12 15C12 12.7909 13.7909 11 16 11H29C30.6569 11 32 12.3431 32 14V16H14C12.8954 16 12 15.1046 12 14V15Z" fill="white" fill-opacity="0.3" />

  <!-- Layer 2: Main Collectly Card ("C" geometry with form lines) -->
  <g filter="url(#favicon-shadow)">
    <!-- Main Card Body -->
    <rect x="11" y="15" width="26" height="23" rx="5" fill="url(#favicon-card)" />

    <!-- Form Header Indicator Pill -->
    <rect x="14.5" y="18.5" width="9" height="2.5" rx="1.25" fill="#2563EB" />

    <!-- Form Field Row 1 with Checkmark Dot -->
    <circle cx="16" cy="25" r="1.5" fill="#06B6D4" />
    <rect x="19.5" y="24" width="13.5" height="2" rx="1" fill="#94A3B8" />

    <!-- Form Field Row 2 -->
    <circle cx="16" cy="30.5" r="1.5" fill="#3B82F6" />
    <rect x="19.5" y="29.5" width="9.5" height="2" rx="1" fill="#CBD5E1" />

    <!-- Vibrant "C" Ribbon Loop Accent on Right Border -->
    <path d="M33 19C35.2091 19 37 20.7909 37 23V30C37 32.2091 35.2091 34 33 34H30" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- AI Sparkle / Star (Top Right) -->
  <path d="M35 11C35 13.7614 36.2386 15 39 15C36.2386 15 35 16.2386 35 19C35 16.2386 33.7614 15 31 15C33.7614 15 35 13.7614 35 11Z" fill="url(#favicon-spark)" />
  <circle cx="35" cy="15" r="1" fill="#FFFFFF" />
</svg>
